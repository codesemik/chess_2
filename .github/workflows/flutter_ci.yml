name: Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Bağımlılıkları indir
        run: flutter pub get

      - name: Setup mock Firebase options
        run: cp lib/firebase_options.example.dart lib/firebase_options.dart

      - name: Statik analiz (flutter analyze)
        run: flutter analyze --no-fatal-infos

      - name: Testleri çalıştır (kapsam raporuyla)
        run: flutter test --coverage

      - name: Kapsam raporunu artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info